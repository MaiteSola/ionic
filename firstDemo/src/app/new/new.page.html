<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/"></ion-back-button>
    </ion-buttons>
    <ion-title>new</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">new</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-button (click)="scrollToBottom()" shape="round"
    >Scroll to bottom</ion-button
  >

  <ion-list>
    @for (item of items; track item.id) {
    <ion-item>
      <ion-icon aria-hidden="true" [icon]="item.icon" slot="start"></ion-icon>
      <ion-label>{{ item.nombre }}</ion-label>
    </ion-item>
    }
  </ion-list>

  <ion-button fill="clear" (click)="scrollToTop()">Scroll to Top</ion-button>
</ion-content>
